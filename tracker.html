<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Log · Five O'Clock Gym Plan</title>
<meta name="description" content="Log every set with weight and reps, run the rest timer, and mark sessions complete.">
<meta name="theme-color" content="#F1F3F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E131A" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gym Plan">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/css/style.css">
<script>try{var t=localStorage.getItem("fogp:theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body data-page="tracker">
<header id="site-header"></header>

<main class="wrap">
  <section class="page-head">
    <div class="sec-head" style="align-items:center"><h1>Log</h1><div class="seg-ctl" id="who" role="group" aria-label="Who is logging on this phone"></div></div>
    <p class="hint">Enter the weight and reps, then tap <b>✓</b> to finish the set and start the rest timer. Grey numbers are last week's. Tapping ✓ on an empty set copies them.</p>
  </section>

  <section class="sec">
    <div class="log-top">
      <div class="weeknav">
        <button type="button" id="wk-prev" aria-label="Previous week">‹</button>
        <span class="lbl" id="wk-label"></span>
        <button type="button" id="wk-next" aria-label="Next week">›</button>
      </div>
      <button type="button" class="btn" id="wk-now">Today</button>
    </div>
    <div class="daystrip" id="days" role="group" aria-label="Pick a day"></div>
  </section>

  <section class="sec" id="session" aria-live="polite"></section>
</main>

<div class="rest-bar" id="rest" hidden role="timer" aria-live="off">
  <div><div class="lbl" id="rest-lbl">Rest</div><div class="clock" id="rest-clock">0:00</div></div>
  <div class="ctl"><button type="button" id="rest-minus" aria-label="15 seconds less">−15</button><button type="button" id="rest-plus" aria-label="15 seconds more">+15</button><button type="button" id="rest-skip">Skip</button></div>
  <div class="rest-track"><i id="rest-track"></i></div>
</div>

<footer id="site-footer"></footer>
<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/tracker.js"></script>
</body>
</html>
